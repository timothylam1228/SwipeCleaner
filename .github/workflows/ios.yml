name: iOS Build and Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS 14 runners include an iOS Simulator runtime; the current macOS 15
    # image exposes only the generic simulator placeholder.
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run app unit tests
        run: >-
          xcodebuild test
          -project SwipeCleaner.xcodeproj
          -scheme SwipeCleaner
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest'
          CODE_SIGNING_ALLOWED=NO
